# List of module names to be loaded at boot-time
# Installed into /etc/modules-load.d/ as lava-dispatcher-host-modules.conf

# lava-dispatcher-host runs with ProtectKernelModules=true and cannot load
# kheaders itself, which bcc needs to compile the cgroups v2 device sharing
# programs. Kernels that build kheaders (CONFIG_IKHEADERS=m) get it loaded
# here, before the service starts. On kernels that do not, the load fails
# and nothing breaks: bcc uses installed kernel headers instead.
kheaders
